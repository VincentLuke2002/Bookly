<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History — Bookly</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><header id="siteHeader"></header><main><section class="page-hero"><div class="container"><div class="breadcrumb-bookly">Account / Order history</div><span class="eyebrow">Orders and bookings</span><h1 class="section-title">Everything you have ordered.</h1><p class="text-muted">Track fulfilment, cancel upcoming requests, and review completed services.</p></div></section><section class="section"><div class="container"><div class="history-toolbar"><div class="filter-bar"><button class="filter-chip active" data-status="all">All orders</button><button class="filter-chip" data-status="upcoming">Upcoming</button><button class="filter-chip" data-status="completed">Completed</button><button class="filter-chip" data-status="cancelled">Cancelled</button></div><input id="orderSearch" class="input-bookly" placeholder="Search order number"></div><div id="orderHistory"><div class="loading-state">Loading order history...</div></div></div></section></main><footer id="siteFooter"></footer><script src="js/main.js"></script></body></html>
