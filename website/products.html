<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Catalog — Bookly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="siteHeader"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb-bookly">Home / Service catalog</div>
        <span class="eyebrow">Trusted local talent</span>
        <h1 class="section-title">Find the right person for the job.</h1>
        <p class="text-muted col-lg-6">Compare verified providers using transparent pricing, availability, customer ratings, and service details.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="catalog-toolbar">
          <div class="catalog-search"><label class="sr-only" for="serviceSearch">Search services</label><input id="serviceSearch" class="input-bookly" placeholder="Search provider, service, or location"><span>⌕</span></div>
          <div class="filter-bar"><button class="filter-chip" data-cat="all">All</button><button class="filter-chip" data-cat="cleaning">Cleaning</button><button class="filter-chip" data-cat="repair">Repair</button><button class="filter-chip" data-cat="tutoring">Tutoring</button><button class="filter-chip" data-cat="tech">Tech support</button></div>
        </div>
        <div class="catalog-meta">
          <strong id="resultCount"></strong>
          <div class="sort-control"><label for="sortServices">Sort by</label><select id="sortServices" class="select-bookly"><option value="recommended">Recommended</option><option value="rating">Highest rated</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="name">Name: A to Z</option></select></div>
        </div>
        <div id="providerGrid" class="row g-4"></div>
      </div>
    </section>
  </main>
  <footer id="siteFooter"></footer>
  <script src="js/main.js"></script>
</body>
</html>
